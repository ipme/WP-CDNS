# .github/workflows/npm-publish.yml
name: Publish to NPM
on:
  push:
    tags:
      - 'v*'

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 22
          # 删掉 registry-url 这一行！！

      - name: Update npm
        run: npm install -g npm@11.5.1

      - name: Publish
        run: npm publish --access public --provenance

